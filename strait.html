<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海峡守望 — HUD CONSOLE</title>
<link rel="stylesheet" href="css/hud.css">
<style id="page-style">
  /* STRAIT WATCH — chokepoint monitoring console.
     Layout mirrors a classic traffic-watch console: nav rail + map + bottom strip. */
  .frame {
    grid-template-columns: 232px minmax(0, 1fr) 292px;
    grid-template-rows: 44px minmax(0, 1fr) 216px 18px;
    grid-template-areas:
      "top top top"
      "nav center right"
      "nav bottom bottom"
      "foot foot foot";
  }
  .top { grid-area: top; }
  .frame > aside.col.left { grid-area: nav; }
  .frame > main.center { grid-area: center; grid-template-rows: minmax(0, 1fr); }
  .frame > aside.col.right { grid-area: right; }
  .frame > .bottomstrip { grid-area: bottom; }
  .frame > footer.bottom { grid-area: foot; }

  /* ---------- left rail: [STRAIT] menu + layers ---------- */
  .menu-panel .body { display: flex; flex-direction: column; gap: 2px; }
  .menu-row {
    display: flex; align-items: center; gap: 10px;
    padding: 5px 2px; font-size: 9px; letter-spacing: 0.18em;
    color: var(--dim); border-bottom: var(--line-w) dashed color-mix(in srgb, var(--fg) 6%, transparent);
    cursor: pointer; user-select: none;
  }
  .menu-row:hover { color: var(--fg); }
  .menu-row b { margin-left: auto; font-weight: 300; color: var(--dim); font-variant-numeric: tabular-nums; }
  .menu-row.hot b { color: var(--accent); }
  .menu-row.on { color: var(--fg); background: rgba(var(--accent-rgb), 0.07); }
  .menu-row .box {
    width: 9px; height: 9px; flex: none;
    border: var(--line-w) solid var(--dim);
    display: inline-grid; place-items: center; font-size: var(--fs-xs); color: var(--accent);
  }
  .menu-row.checked .box { border-color: var(--accent); }
  .menu-row .box::after { content: ""; }
  .menu-row.checked .box::after { content: "✕"; }
  .menu-title { font-size: 12px; letter-spacing: 0.18em; padding: 4px 2px 6px; }
  .menu-title small { float: right; color: var(--accent); font-size: var(--fs-xs); }
  .layers-label { font-size: var(--fs-xs); letter-spacing: 0.07em; color: var(--dim); margin: 8px 2px 2px; }

  /* ---------- map viewport ---------- */
  .viewport { cursor: crosshair; }
  .viewport > canvas#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .viewport .hint { position: absolute; left: 46px; bottom: 10px; color: var(--dim); font-size: var(--fs-xs); letter-spacing: 0.08em; z-index: 2; pointer-events: none; }
  .viewport .seal { position: absolute; right: 10px; bottom: 8px; color: var(--dim); font-size: var(--fs-xs); letter-spacing: 0.07em; z-index: 2; pointer-events: none; text-align: right; }
  .viewport header { pointer-events: none; }

  /* ---------- bottom strip: 4 instruments ---------- */
  .bottomstrip { display: grid; grid-template-columns: 1.35fr 1.5fr 0.9fr 1.15fr; gap: var(--gap); min-height: 0; }
  .bottomstrip .panel { min-height: 0; }

  /* target inspector */
  .inspector .body { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 10px; }
  .inspector canvas.hull { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hull-wrap { position: relative; min-height: 0; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2.5px 10px; font-size: var(--fs-sm); align-content: start; }
  .kv dt { color: var(--dim); letter-spacing: 0.16em; }
  .kv dd { text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kv dd.acc { color: var(--accent); }
  .kv dd.score-bad { color: var(--danger); }

  /* queue KPIs */
  .queue-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; padding-top: 2px; }
  .queue-kpis b { display: block; font-size: 17px; font-weight: 300; letter-spacing: 0.04em; }
  .queue-kpis small { display: block; font-size: var(--fs-xs); color: var(--dim); letter-spacing: 0.04em; margin-top: 1px; }
  .queue-kpis .acc b { color: var(--accent); }
  .queue-kpis canvas { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 46%; display: block; }

  /* alert feed */
  .feed { list-style: none; position: absolute; inset: 0; overflow: hidden; font-size: var(--fs-sm); }
  .feed li { display: grid; grid-template-columns: 30px 52px 1fr auto; gap: 8px; padding: 2.5px 0; color: color-mix(in srgb, var(--fg) 72%, transparent); white-space: nowrap; }
  .feed li:first-child { color: var(--fg); }
  .feed time { color: var(--dim); font-variant-numeric: tabular-nums; }
  .feed .code { color: var(--dim); letter-spacing: 0.08em; overflow: hidden; }
  .feed span.msg { overflow: hidden; }
  .feed li.warn .code, .feed li.warn span.msg { color: var(--accent); }
  .feed .sev { font-size: var(--fs-xs); letter-spacing: 0.04em; border: var(--line-w) solid var(--line); padding: 0 3px; color: var(--dim); }
  .feed li.warn .sev { border-color: rgba(var(--accent-rgb), 0.5); color: var(--accent); }
  .feed li.crit .sev { border-color: rgba(var(--danger-rgb), 0.6); color: var(--danger); }

  /* vessels table */
  .vessels .body { overflow: hidden; }
  #vessels tr { cursor: pointer; }
  #vessels tr.on td { color: var(--fg); background: rgba(var(--accent-rgb), 0.08); }
  #vessels tr.on td:first-child { color: var(--accent); }
  #vessels td.st-wait { color: var(--dim); }
  #vessels td.st-go { color: var(--fg); }
  #vessels td.name { max-width: 88px; overflow: hidden; text-overflow: ellipsis; }

  /* status + log + wind */
  .status .body { display: grid; grid-template-columns: 76px 1fr; gap: 10px; }
  .status .dial { position: relative; }
  .status .dial canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .log-panel { flex: 0.9; }

  @media (max-width: 1100px) {
    .frame { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "top" "center" "nav" "right" "bottom" "foot"; height: auto; }
    .center { order: 0; min-height: 70vh; }
    .bottomstrip { grid-template-columns: 1fr 1fr; }
    .col .panel { min-height: 180px; }
  }
</style>
</head>
<body>
<div class="frame">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1">
        <rect x="0.5" y="0.5" width="27" height="27"/>
        <path d="M4 20 L24 20 L21 23 L7 23 Z"/>
        <path d="M14 6 L14 18 M10 10 L14 6 L18 10"/>
        <path d="M6 4 L10 4 M6 4 L6 8" stroke-dasharray="1 2"/>
      </svg>
      <div><b id="brand-name" data-en="STRAIT WATCH">海峡守望</b><small id="brand-sub" data-en="CHOKEPOINT MONITOR">咽喉要道监控</small></div>
    </div>
    <div class="ticker" id="ticker"><span></span><span></span><span></span></div>
    <nav class="navs">
      <div class="pages" id="site-nav"><a href="index.html">CONSOLE</a><a href="lab.html">LAB</a></div>
      <div class="pages" id="lang-nav"></div>
      <div class="pages" id="scheme-nav"></div>
    </nav>
    <div class="clock">
      <div class="legend" id="legend"></div>
      <div><small id="date"></small><b id="clock"></b></div>
    </div>
  </header>

  <aside class="col left">
    <section class="panel menu-panel">
      <header><span class="tag">S</span><span class="p-title" data-en="STRAIT">海峡</span><small class="p-note" id="strait-note" data-en="NORTHBOUND">北向</small></header>
      <div class="body">
        <div class="menu-title">[海峡]<small id="menu-alert-dot"></small></div>
        <div class="menu-row" data-menu="queue"><span data-en="QUEUE">队列</span><b id="menu-queue">–</b></div>
        <div class="menu-row on" data-menu="vessels"><span data-en="VESSELS">船只</span><b id="menu-vessels">–</b></div>
        <div class="menu-row" data-menu="alerts"><span data-en="ALERTS">警报</span><b id="menu-alerts">0</b></div>
        <div class="menu-row" data-menu="replay"><span data-en="REPLAY">回放</span><b>24H</b></div>
        <div class="layers-label" data-en="LAYERS">图层</div>
        <div class="menu-row checked" data-layer="tracks"><span class="box"></span><span data-en="TRACKS">航迹</span></div>
        <div class="menu-row checked" data-layer="anchorage"><span class="box"></span><span data-en="ANCHORAGE">锚地</span></div>
        <div class="menu-row" data-layer="aisdark"><span class="box"></span><span data-en="AIS-DARK">AIS 静默</span></div>
        <div class="menu-row" data-layer="bathymetry"><span class="box"></span><span data-en="BATHYMETRY">水深</span></div>
        <div class="menu-row" data-layer="weather"><span class="box"></span><span data-en="WEATHER">气象</span></div>
      </div>
    </section>

    <section class="panel vessels" style="flex: 1.5">
      <header><span class="tag">V</span><span class="p-title" data-en="VESSELS">船只</span><small class="p-note" id="vessels-note"></small></header>
      <div class="body">
        <table>
          <thead><tr><th data-en="NAME">船名</th><th data-en="FLAG">船旗</th><th class="num" data-en="SPD">航速</th><th class="num" data-en="ST">状态</th></tr></thead>
          <tbody id="vessels"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <header><span class="tag">T</span><span class="p-title" data-en="TRANSIT COUNT">通行量</span><small class="p-note">24H</small></header>
      <div class="body"><canvas id="count"></canvas></div>
    </section>
  </aside>

  <main class="center">
    <section class="panel viewport">
      <canvas id="map"></canvas>
      <header><span class="tag">01</span><span class="p-title" id="vp-title" data-en="CHOKEPOINT WATCH">咽喉要道监控</span><small class="p-note" id="vp-note"></small></header>
      <div class="hint" data-en="CLICK VESSEL · INSPECT   CLICK LAYER · TOGGLE">点击船只 · 检视　　点击图层 · 切换</div>
      <div class="seal" id="map-seal" data-en="GRID WGS-84 · CHART 2425 · NOT FOR NAVIGATION">网格 WGS-84 · 海图 2425 · 非航行用途</div>
    </section>
  </main>

  <aside class="col right">
    <section class="panel status">
      <header><span class="tag">E</span><span class="p-title" data-en="ENVIRONMENT">环境</span><small class="p-note" id="env-note" data-en="LIVE">实时</small></header>
      <div class="body">
        <div class="dial"><canvas id="wind-dial"></canvas></div>
        <div class="kpis" id="env-kpis" style="grid-template-columns: 1fr 1fr"></div>
      </div>
    </section>

    <section class="panel" style="flex: 1.2">
      <header><span class="tag">W</span><span class="p-title" data-en="SURVEILLANCE">监视</span><small class="p-note" id="radar-note"></small></header>
      <div class="body"><canvas id="radar"></canvas></div>
    </section>

    <section class="panel log-panel">
      <header><span class="tag">L</span><span class="p-title" data-en="EVENT LOG">事件日志</span><small class="p-note" data-en="LIVE">实时</small></header>
      <div class="body"><ul id="log"></ul></div>
    </section>
  </aside>

  <div class="bottomstrip">
    <section class="panel">
      <header><span class="tag">A</span><span class="p-title" data-en="TRANSIT">通行</span><small class="p-note" id="transit-note"></small></header>
      <div class="body"><canvas id="transit"></canvas></div>
    </section>

    <section class="panel inspector">
      <header><span class="tag">B</span><span class="p-title" data-en="TARGET INSPECTOR">目标检视</span><small class="p-note" id="inspector-note"></small></header>
      <div class="body">
        <div class="hull-wrap"><canvas class="hull" id="hull"></canvas></div>
        <dl class="kv" id="inspector"></dl>
      </div>
    </section>

    <section class="panel">
      <header><span class="tag">C</span><span class="p-title" data-en="TRANSIT QUEUE">通行队列</span><small class="p-note" data-en="GATE S">南门</small></header>
      <div class="body">
        <div class="queue-kpis">
          <div><b id="q-wait">–</b><small data-en="WAIT">等待</small></div>
          <div><b id="q-dwell">–</b><small data-en="DWELL">滞留</small></div>
          <div><b id="q-clear">–</b><small data-en="CLEAR">通行</small></div>
          <div class="acc"><b id="q-delta">–</b><small data-en="DELTA">增量</small></div>
        </div>
        <canvas id="queue-spark"></canvas>
      </div>
    </section>

    <section class="panel">
      <header><span class="tag">D</span><span class="p-title" data-en="ALERT FEED">警报流</span><small class="p-note" id="feed-note"></small></header>
      <div class="body"><ul class="feed" id="feed"></ul></div>
    </section>
  </div>

  <footer class="bottom" id="footer"></footer>
</div>
<canvas id="grain"></canvas>
<script type="module" src="js/views/strait.js"></script>
</body>
</html>
